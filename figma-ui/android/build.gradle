// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        // Local patched paystack-ui: the sheet is made full-page (height 1.0,
        // no scrim, square corners). See local-repo/.../0.1.8-vura.
        maven { url = uri("$rootDir/local-repo") }
        google()
        mavenCentral()
    }
}

// Capacitor 8's plugin modules declare Java 21. This build machine has JDK 17,
// and every plugin shipped here is Java-17 compatible (the app module is
// already pinned to 17). Pin the library modules too so a clean `cap sync`
// cannot break the build again.
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('com.android.library') ||
            project.plugins.hasPlugin('com.android.application')) {
            project.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

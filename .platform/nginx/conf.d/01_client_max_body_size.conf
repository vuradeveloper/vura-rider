# The Express server accepts JSON bodies up to 30 MB (server/src/index.ts)
# so base64 document uploads (≤15 MB binary → ~20 MB base64) fit.
# EB's default nginx historically caps requests at 1 MB, which killed every
# real phone-photo upload with "413 Request Entity Too Large". Match the app
# limit with headroom.
client_max_body_size 40m;